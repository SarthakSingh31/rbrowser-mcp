[package]
name = "rbrowser-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chromey = "2.58.2"
clap = { version = "4.6.2", features = ["derive"] }
futures = "0.3.32"
libc = "0.2"
rmcp = { version = "2.2.0", features = ["macros", "server", "transport-io"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
